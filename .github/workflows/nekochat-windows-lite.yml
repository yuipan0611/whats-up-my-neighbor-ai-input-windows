name: NekoChat Windows Lite
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: nekochat-lite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    name: NekoChat Lite Relay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r nekochat/relay/requirements-dev.txt
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --classroom-all
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --blocking
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --contacts
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --contacts-ui-seed-check
      - run: dotnet run --project windows-lite/NekoChat.Animation.Tests -c Release -- windows-lite/NekoChat.Animation/Assets/manifest.json
      - name: Protocol, auth, real WebSocket and C# integration tests
        run: NEKOCHAT_DOTNET="$(command -v dotnet)" python -m pytest nekochat/relay/tests -q
  windows:
    name: NekoChat Lite Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s windows-lite/tools -p "test_*.py"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --classroom-all
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --blocking
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --contacts
      - run: dotnet run --project windows-lite/NekoChat.Tests -c Release --no-build -- --contacts-ui-seed-check
      - run: dotnet run --project windows-lite/NekoChat.Animation.Tests -c Release -- windows-lite/NekoChat.Animation/Assets/manifest.json
      - run: dotnet build windows-lite/NekoChat.Windows -c Release
      - name: Publish single-file portable EXE (Zero-Setup Classroom App)
        shell: pwsh
        run: |
          dotnet publish windows-lite/NekoChat.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/windows-lite-portable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item build/windows-lite-portable/NekoChat.Windows.exe build/windows-lite-portable/NekoChat-Lite.exe
          (Get-FileHash build/windows-lite-portable/NekoChat-Lite.exe -Algorithm SHA256).Hash | Out-File build/windows-lite-portable/NekoChat-Lite.exe.sha256 -Encoding ascii
      - name: Verify standalone bundle content without the Windows loader
        run: python windows-lite/tools/verify_bundle.py build/windows-lite-portable/NekoChat-Lite.exe --repo . --output build/windows-lite-smoke/portable-bundle.json
      - name: Publish self-contained x64 package
        shell: pwsh
        run: |
          dotnet publish windows-lite/NekoChat.Windows -c Release -r win-x64 --self-contained true -o build/windows-lite-package
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item windows-lite/README.md build/windows-lite-package/README.md
          Copy-Item windows-lite/DIAGNOSTICS.md build/windows-lite-package/DIAGNOSTICS.md
          Copy-Item windows-lite/DELIVERY.md build/windows-lite-package/DELIVERY.md
          Copy-Item windows-lite/ATTACHMENTS.md build/windows-lite-package/ATTACHMENTS.md
          Copy-Item windows-lite/SEND-CANCELLATION.md build/windows-lite-package/SEND-CANCELLATION.md
          Copy-Item windows-lite/BACKUP-RESTORE.md build/windows-lite-package/BACKUP-RESTORE.md
          Copy-Item LICENSE build/windows-lite-package/LICENSE
          Copy-Item windows-lite/THIRD-PARTY.md build/windows-lite-package/THIRD-PARTY.md
          New-Item -ItemType Directory -Force build/windows-lite-package/tools | Out-Null
          Copy-Item windows-lite/tools/README.md build/windows-lite-package/tools/README.md
      - name: Verify native diagnostics and failure recovery in package and portable apps
        shell: pwsh
        run: |
          foreach ($app in @('build/windows-lite-package/NekoChat.Windows.exe', 'build/windows-lite-portable/NekoChat-Lite.exe')) {
            $kind = if ($app -like '*portable*') { 'portable' } else { 'package' }
            $proof = Join-Path $env:GITHUB_WORKSPACE "build/windows-lite-smoke/diagnostics-$kind"
            $probe = Start-Process -FilePath (Resolve-Path $app).Path -ArgumentList @('--diagnostics-smoke-test', "`"$proof`"") -PassThru
            if (-not $probe.WaitForExit(120000)) { $probe.Kill(); throw "Diagnostics smoke timed out: $kind" }
            Get-Content "$proof/diagnostics-result.json"
            if ($probe.ExitCode -ne 0) { throw "Diagnostics smoke failed: $kind" }
          }
      - name: Verify visible chat clears unread badges in native WPF
        shell: pwsh
        run: |
          foreach ($app in @('build/windows-lite-package/NekoChat.Windows.exe', 'build/windows-lite-portable/NekoChat-Lite.exe')) {
            $kind = if ($app -like '*portable*') { 'portable' } else { 'package' }
            $proof = Join-Path $env:GITHUB_WORKSPACE "build/windows-lite-smoke/unread-$kind"
            $probe = Start-Process -FilePath (Resolve-Path $app).Path -ArgumentList @('--unread-smoke-test', "`"$proof`"") -PassThru
            if (-not $probe.WaitForExit(90000)) { $probe.Kill(); throw "Unread smoke timed out: $kind" }
            Get-Content "$proof/unread-result.json"
            if ($probe.ExitCode -ne 0) { throw "Unread smoke failed: $kind" }
          }
      - name: Verify contacts teacher archives blocking and deletion in native WPF
        timeout-minutes: 6
        shell: pwsh
        run: |
          foreach ($app in @('build/windows-lite-package/NekoChat.Windows.exe', 'build/windows-lite-portable/NekoChat-Lite.exe')) {
            $kind = if ($app -like '*portable*') { 'portable' } else { 'package' }
            $proof = Join-Path $env:GITHUB_WORKSPACE "build/windows-lite-smoke/contacts-ui-$kind"
            $probe = Start-Process -FilePath (Resolve-Path $app).Path -ArgumentList @('--contacts-ui-smoke-test', "`"$proof`"") -PassThru
            if (-not $probe.WaitForExit(150000)) { $probe.Kill(); throw "Contacts UI smoke timed out: $kind" }
            $resultFile = Join-Path $proof 'contacts-ui-result.json'
            if (-not (Test-Path $resultFile)) { throw "Contacts UI result missing: $kind" }
            Get-Content $resultFile
            $result = Get-Content $resultFile -Raw | ConvertFrom-Json
            if ($probe.ExitCode -ne 0 -or $result.passed -ne $true -or $result.dailyProfileUsed -ne $false -or $result.loopbackOnly -ne $true -or $result.dialogsAutoAnswered -ne $true -or $result.backgroundSendLoopsStarted -ne $false -or $result.seedSchemaVersion -ne 13 -or $result.syntheticSourceMapping -ne $true) {
              throw "Contacts UI smoke failed or isolation flags invalid: $kind"
            }
            if ($result.captures.Count -lt 18) { throw "Missing native contacts UI screenshots: $kind" }
            foreach ($capture in $result.captures) {
              if (-not (Test-Path (Join-Path $proof $capture))) { throw "Missing contacts UI capture: $capture" }
            }
          }
      - name: Upload contacts UI JSON and synthetic screenshots even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekochat-lite-contacts-ui-smoke
          path: |
            build/windows-lite-smoke/contacts-ui-*/contacts-ui-result.json
            build/windows-lite-smoke/contacts-ui-*/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify installed App without external runtimes
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/no-external-dotnet"
          $app = "$env:GITHUB_WORKSPACE/build/windows-lite-package/NekoChat.Windows.exe"
          $proof = "$env:GITHUB_WORKSPACE/build/windows-lite-smoke"
          $smoke = Start-Process -FilePath $app -ArgumentList @('--smoke-test', "`"$proof`"") -Wait -PassThru
          Get-Content "$proof/result.txt"
          if ($smoke.ExitCode -ne 0) { exit 1 }
          $textOnlyProof = Join-Path $proof 'startup-smoke'
          $textOnly = Start-Process -FilePath $app -ArgumentList @('--startup-smoke-test', "`"$textOnlyProof`"") -Wait -PassThru
          Get-Content "$textOnlyProof/startup-result.txt"
          if ($textOnly.ExitCode -ne 0) { exit 1 }
      - name: Verify failure recovery, local deletion and existing nickname menu
        shell: pwsh
        run: |
          $index = 0
          foreach ($app in @('build/windows-lite-package/NekoChat.Windows.exe', 'build/windows-lite-portable/NekoChat-Lite.exe')) {
            $proof = Join-Path $env:GITHUB_WORKSPACE "build/windows-lite-smoke/message-recovery-$index"
            $probe = Start-Process -FilePath (Resolve-Path $app).Path -ArgumentList @('--message-recovery-smoke-test', "`"$proof`"") -PassThru
            if (!$probe.WaitForExit(65000)) { $probe.Kill(); throw 'Message recovery fixture timed out' }
            Get-Content "$proof/message-recovery-result.json"
            if ($probe.ExitCode -ne 0) { throw 'Message recovery fixture failed' }
            $index++
          }
      - name: Verify native update download progress and cancellation
        shell: pwsh
        run: |
          $apps = @('build/windows-lite-package/NekoChat.Windows.exe', 'build/windows-lite-portable/NekoChat-Lite.exe')
          $index = 0
          foreach ($app in $apps) {
            $target = Join-Path ([System.IO.Path]::GetTempPath()) "nekochat-update-download-$env:GITHUB_RUN_ID-$index"
            $probe = Start-Process -FilePath (Resolve-Path $app).Path -ArgumentList @('--update-download-smoke-test', "`"$target`"") -PassThru
            if (!$probe.WaitForExit(45000)) { $probe.Kill(); throw 'Update download UI timed out' }
            Get-Content "$target/result.txt"
            if ($probe.ExitCode -ne 0) { throw 'Update download UI failed' }
            New-Item -ItemType Directory -Force build/windows-lite-smoke/update-download | Out-Null
            Copy-Item "$target/result.txt" "build/windows-lite-smoke/update-download/result-$index.txt"
            $index++
          }
      - name: Verify current manual-send Cancel controls in isolated native fixtures
        shell: pwsh
        run: |
          $index = 0
          foreach ($app in @('build/windows-lite-package/NekoChat.Windows.exe', 'build/windows-lite-portable/NekoChat-Lite.exe')) {
            $proof = Join-Path $env:GITHUB_WORKSPACE "build/windows-lite-smoke/manual-cancel-$index"
            $probe = Start-Process -FilePath (Resolve-Path $app).Path -ArgumentList @('--manual-send-cancel-smoke-test', "`"$proof`"") -PassThru
            if (!$probe.WaitForExit(60000)) { $probe.Kill(); throw 'Manual send Cancel fixture timed out' }
            if (Test-Path "$proof/manual-send-cancel-result.json") {
              Get-Content "$proof/manual-send-cancel-result.json"
            }
            if ($probe.ExitCode -ne 0) {
              Get-ChildItem -Path $proof -ErrorAction SilentlyContinue | Format-List
              throw "Manual send Cancel fixture failed with exit code $($probe.ExitCode)"
            }
            $result = Get-Content "$proof/manual-send-cancel-result.json" -Raw | ConvertFrom-Json
            if (!$result.passed -or !$result.cleaned -or $result.productIdentityModeSelected -or $result.productMaximumTextBytesSelected) { throw 'Invalid isolated cancellation result' }
            $index++
          }
      - name: Verify packaged and portable apps exchange real messages
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/no-external-dotnet"
          & ./scripts/test-lite-messaging.ps1 -App build/windows-lite-package/NekoChat.Windows.exe -OutputDirectory build/windows-lite-smoke/messaging-package
          New-Item -ItemType Directory -Path build/windows-lite-portable-isolated | Out-Null
          Copy-Item build/windows-lite-portable/NekoChat-Lite.exe build/windows-lite-portable-isolated/NekoChat-Lite.exe
          & ./scripts/test-lite-messaging.ps1 -App build/windows-lite-portable-isolated/NekoChat-Lite.exe -OutputDirectory build/windows-lite-smoke/messaging-portable
      - name: Build single-file per-user installer
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows-lite-package/* -DestinationPath build/NekoChat-Windows-Lite-win-x64.zip
          $payload = "$env:GITHUB_WORKSPACE/build/NekoChat-Windows-Lite-win-x64.zip"
          $checksum = "$env:GITHUB_WORKSPACE/build/NekoChat-Windows-Lite-win-x64.zip.sha256"
          (Get-FileHash $payload -Algorithm SHA256).Hash | Out-File $checksum -Encoding ascii
          dotnet publish windows-lite/NekoChat.Installer -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:PackagePayload=$payload" "-p:PackageChecksum=$checksum" -o build/windows-lite-setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-FileHash build/windows-lite-setup/NekoChat-Setup-win-x64.exe -Algorithm SHA256).Hash | Out-File build/windows-lite-setup/NekoChat-Setup-win-x64.exe.sha256 -Encoding ascii
      - name: Verify automatic LAN firewall setup and rollback
        shell: pwsh
        run: |
          & ./scripts/test-lite-firewall.ps1 -Setup build/windows-lite-setup/NekoChat-Setup-win-x64.exe -OutputDirectory build/windows-lite-smoke/firewall
      - name: Verify standalone Setup.exe extraction without external runtimes
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/no-external-dotnet"
          $target = Join-Path ([System.IO.Path]::GetTempPath()) "nekochat-installer-smoke-$env:GITHUB_RUN_ID"
          $setup = "$env:GITHUB_WORKSPACE/build/windows-lite-setup/NekoChat-Setup-win-x64.exe"
          $check = Start-Process -FilePath $setup -ArgumentList @('--smoke-install', "`"$target`"") -Wait -PassThru
          Write-Output "Setup verification exit code: $($check.ExitCode)"
          if (!(Test-Path "$target/result.txt")) { throw 'Setup did not produce its verification report.' }
          Get-Content "$target/result.txt"
          if ($check.ExitCode -ne 0) { exit 1 }
          Copy-Item "$target/result.txt" build/windows-lite-smoke/installer-result.txt
          & ./scripts/test-lite-messaging.ps1 -App "$target/Programs/NekoChat.WindowsLite/NekoChat.Windows.exe" -OutputDirectory build/windows-lite-smoke/messaging-installed
      - name: Verify release versions and record artifact provenance
        shell: pwsh
        run: |
          $expected = ([xml](Get-Content windows-lite/NekoChat.Windows/NekoChat.Windows.csproj -Raw)).Project.PropertyGroup.Version
          $expectedFile = ([xml](Get-Content windows-lite/NekoChat.Windows/NekoChat.Windows.csproj -Raw)).Project.PropertyGroup.FileVersion
          $files = @('build/windows-lite-portable/NekoChat-Lite.exe', 'build/windows-lite-setup/NekoChat-Setup-win-x64.exe')
          $assets = foreach ($file in $files) {
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $file).Path)
            if ($info.ProductVersion.Split('+')[0] -ne $expected -or $info.FileVersion -ne $expectedFile) {
              throw "Release version mismatch: $file ($($info.ProductVersion), $($info.FileVersion))"
            }
            @{ name = [IO.Path]::GetFileName($file); size = (Get-Item $file).Length; sha256 = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); productVersion = $info.ProductVersion; fileVersion = $info.FileVersion }
          }
          @{ version = $expected; sourceCommit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; assets = @($assets) } |
            ConvertTo-Json -Depth 5 | Set-Content build/windows-lite-setup/release-provenance.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekochat-windows-lite-portable
          path: |
            build/windows-lite-portable/NekoChat-Lite.exe
            build/windows-lite-portable/NekoChat-Lite.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekochat-windows-lite-setup
          path: |
            build/windows-lite-setup/NekoChat-Setup-win-x64.exe
            build/windows-lite-setup/NekoChat-Setup-win-x64.exe.sha256
            build/windows-lite-setup/release-provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekochat-windows-lite-trial
          path: |
            build/NekoChat-Windows-Lite-win-x64.zip
            build/NekoChat-Windows-Lite-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nekochat-windows-smoke-captures
          path: build/windows-lite-smoke/
          if-no-files-found: warn

  stage-release-draft:
    name: Stage verified Lite release draft
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [relay, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Attach exact tested main artifacts to an existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stage-lite-release.sh
