name: Lite unread regression
on:
  pull_request:
    paths:
      - 'windows-lite/**'
      - '.github/workflows/lite-unread-regression.yml'
permissions:
  contents: read
concurrency:
  group: lite-unread-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unread:
    name: Native unread regression
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Exercise actual WPF visibility, busy storage and persisted unread state
        shell: pwsh
        run: |
          dotnet run --project windows-lite/NekoChat.Windows -c Release -- --unread-smoke-test "$env:GITHUB_WORKSPACE/build/unread-native"
          $code = $LASTEXITCODE
          Get-Content build/unread-native/unread-result.json
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lite-unread-native
          path: build/unread-native/
          if-no-files-found: error
          retention-days: 14
