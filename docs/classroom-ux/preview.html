<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NekoChat 班級介面預覽</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#1c2c41;font:14px system-ui}body>p{margin:18px auto;max-width:1080px;padding:0 16px;color:#596b80}.app{margin:16px auto;width:min(1080px,100%);height:690px;background:white;display:flex;border:1px solid #dce3ec;border-radius:12px;overflow:hidden}aside{width:268px;flex-shrink:0;border-right:1px solid #dce3ec;padding:18px;display:flex;flex-direction:column;gap:10px}h2{font-size:18px;margin:0 0 10px}h3{font-size:13px;margin:5px 0;color:#596b80}button{font:inherit;cursor:pointer;border:1px solid #dce3ec;border-radius:8px;background:white;color:inherit;padding:9px 12px}.person{display:flex;align-items:center;text-align:left;gap:12px;width:100%}.avatar{background:#e9effd;color:#2859c5;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px}.active{background:#e9effd;border-color:#bfcff5}.small{font-size:12px;color:#596b80}input,textarea{font:inherit;padding:10px;border:1px solid #dce3ec;border-radius:8px;width:100%}.spacer{flex:1}main{min-width:0;flex:1;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #dce3ec}header strong{display:block;font-size:17px}.history{flex:1;padding:24px;overflow:auto}.bubble{max-width:330px;background:#f1f5fa;padding:14px;border-radius:12px}.composer{border-top:1px solid #dce3ec;padding:16px}.reactions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.reactions button{border-radius:18px;padding:5px 12px}.row{display:flex;gap:10px;align-items:end;margin:10px 0}.send{background:#2859c5;color:white;border:0}.back{display:none}dialog{border:1px solid #dce3ec;border-radius:12px;width:min(360px,90vw);color:#1c2c41}dialog::backdrop{background:#13213966}#menu{position:fixed;display:none;box-shadow:0 3px 15px #17243433;z-index:5}label{display:block;margin:12px 0}#recipient{color:#2859c5}@media(max-width:640px){.app{height:calc(100dvh - 110px);min-height:430px;border-radius:0;margin:0}aside{width:100%}main{display:none}.conversation aside{display:none}.conversation main{display:flex}.back{display:inline-block;margin-bottom:10px}.history{padding:16px}}
</style>
<p>互動設計預覽：點老師／同學切換聊天室；右鍵可編輯綽號。以下均為虛構名單。這是 HTML 示意，未連線、未傳訊。</p>
<div class="app" id="app"><aside><h2>🐈 NekoChat Lite</h2><h3>老師</h3><button class="person active" onclick="openChat(true)"><span class="avatar">師</span><span id="teacherName">老師</span></button><h3>同學 · 2 位</h3><input placeholder="搜尋 IP 或綽號" oninput="document.querySelectorAll('.student').forEach(b=>b.hidden=!b.textContent.includes(this.value))"><button class="person student" onclick="openChat(false)"><span class="avatar">🐈</span><span id="peerName">10.0.0.11</span></button><button class="person student" onclick="openChat(false)"><span class="avatar">🐈</span><span>10.0.0.12</span></button><p class="small">綽號只保存在自己的電腦。</p><div class="spacer"></div><button onclick="document.querySelector('#add').showModal()">＋ 加入好友</button></aside><main><header><button class="back" onclick="document.querySelector('#app').classList.remove('conversation')">← 返回名單</button><strong id="title">老師</strong><span class="small">教室區域網路 · 一對一聊天</span></header><section class="history"><div class="bubble">訊息和附件會出現在這個聊天室。</div></section><section class="composer"><span class="small" id="recipient">傳給老師</span><div class="reactions" id="reactions"></div><div class="row"><textarea rows="3" placeholder="輸入訊息…"></textarea><button class="send" onclick="alert('這是設計預覽，沒有傳送訊息。')">傳送</button></div><div class="small">📎 附件　 ·　Enter 傳送 · Shift＋Enter 換行</div></section></main></div>
<dialog id="add"><h2>加入好友</h2><label>輸入對方 IP 位址<input placeholder="例如 10.0.0.11"></label><button onclick="this.closest('dialog').close()">取消</button> <button class="send" onclick="this.closest('dialog').close()">加入好友</button></dialog><button id="menu" onclick="rename()">編輯綽號…</button>
<script>let teacher=true,target;function openChat(t){teacher=t;document.querySelector('#app').classList.add('conversation');document.querySelector('#title').textContent=t?document.querySelector('#teacherName').textContent:document.querySelector('#peerName').textContent;document.querySelector('#recipient').textContent='傳給'+document.querySelector('#title').textContent;document.querySelector('#reactions').replaceChildren(...(t?['講太快了','跟不上','聽不懂','再講一次']:['你再給我滑！']).map(text=>{let b=document.createElement('button');b.textContent=text;b.onclick=()=>alert('預覽：這款貼圖會傳給 '+document.querySelector('#title').textContent);return b}));document.querySelectorAll('.person').forEach(b=>b.classList.toggle('active',(b.querySelector('#teacherName')!==null)===t))}document.querySelectorAll('.person').forEach(b=>b.oncontextmenu=e=>{e.preventDefault();target=b.querySelector('span:last-child');let m=document.querySelector('#menu');m.style.cssText=`display:block;left:${Math.min(e.clientX,innerWidth-150)}px;top:${e.clientY}px`});function rename(){let n=prompt('綽號只保存在這台電腦',target.textContent);if(n&&n.trim())target.textContent=n.trim();openChat(teacher)}document.onclick=()=>document.querySelector('#menu').style.display='none';openChat(true);document.querySelector('#app').classList.remove('conversation');</script></html>
