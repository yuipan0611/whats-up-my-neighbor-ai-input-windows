<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>核對視窗 · 合成排版預覽</title>
<style>*{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;margin:0;background:#edf2f8;color:#1c2c41;font:13px "Microsoft JhengHei UI","PingFang TC",sans-serif}header{flex:none;padding:12px 16px;background:white;border-bottom:1px solid #dce3ec}header p{margin:0 0 8px;color:#596b80}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;min-height:34px;padding:6px 12px;background:white;border:1px solid #596b80;border-radius:4px;color:#1c2c41;cursor:pointer}button:hover:enabled{background:#edf2f8}button:disabled{color:#596b80;background:#f3f6fa;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #2859c5;outline-offset:2px}nav button{min-height:28px;padding:3px 8px}nav button[aria-pressed=true]{background:#e9effd;color:#2859c5;border-color:#2859c5}.window{width:min(520px,100%);height:700px;max-height:700px;min-height:0;flex:1;margin:16px auto;background:white;display:flex;flex-direction:column;border:1px solid #dce3ec}.body{padding:20px 24px 16px;overflow-y:auto;min-height:0;flex:1}h1{font-size:18px;margin:0 0 16px}h2{font-size:16px;margin:0;font-weight:700}.name{font-size:16px;font-weight:600;margin:0}.muted{color:#596b80}.labels{margin:4px 0 8px;overflow-wrap:anywhere}.intent{margin:0 0 20px;line-height:1.55}label.ip{display:block;margin-bottom:4px}input[type=text]{width:100%;padding:6px 8px;border:1px solid #596b80;font:inherit;min-height:32px}small{display:block;font-size:12px;margin:4px 0 8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.state{margin-top:12px;padding-top:20px;border-top:1px solid #dce3ec}.detail{margin:6px 0 12px;line-height:1.55}.number{text-align:center;font:700 32px Consolas,monospace;white-space:nowrap;margin:0}.countdown{text-align:center;margin:4px 0 16px;min-height:19px}.check{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;line-height:1.5}.check input{margin-top:4px}.primary:enabled{background:#2859c5;color:white;border-color:#2859c5}footer{flex:none;padding:12px 24px;background:#f3f6fa;border-top:1px solid #dce3ec;text-align:right}.error{color:#b43e3e;margin:8px 0 0;line-height:1.5}@media(max-width:480px){.window{margin:8px auto;max-height:700px}}
</style><header><p>合成排版預覽 · 無連線／配對功能 · 字型與控制項非 WPF 驗收</p><nav id="states" aria-label="預覽狀態"></nav></header>
<main class="window" aria-label="核對視窗預覽"><div class="body"><h1>核對與綁定同學</h1><p class="name">合成同學 陳小宇</p><p class="muted labels">學號 001 · 老師標籤（不授權）<br>目前尚未綁定身分</p><p class="muted intent" id="intent"></p><label class="ip" for="ip">對方內網 IP</label><input id="ip" type="text" value="192.168.24.12" readonly><small class="muted">沿用開啟時的名單 IP；要變更請關閉並先編輯名單。</small><div class="actions"><button id="begin">發起核對</button><button id="listen">等待對方發起</button></div><section class="state"><h2 id="title"></h2><p id="detail" class="muted detail"></p><p id="number" class="number"></p><p id="countdown" class="muted countdown"></p><label class="check"><input type="checkbox" id="compared"><span>我已面對面核對，兩邊六位數完全相同。</span></label><div class="actions"><button id="confirm" class="primary" disabled>數字相同，確認綁定</button><button id="reject" disabled>數字不同，中止</button></div><p id="error" class="error" aria-live="polite"></p></section></div><footer><button id="close">關閉</button></footer></main>
<script>const copy={"paired": {"title": "本機已完成配對與綁定", "detail": "請查看對方畫面是否也已完成；兩台的儲存結果並非同時提交。"}, "sasshown": {"title": "請與對方面對面核對六位數字", "detail": "姓名、IP 或對方已按確認都不能代替核對。只有兩邊數字完全相同時才繼續。"}, "waiting": {"title": "等候配對結果", "detail": "你已確認。到期或取消後，兩台可能狀態不同；本機取消不能撤回對方已儲存的結果。"}, "listening": {"title": "等待對方發起核對", "detail": "請對方選擇你的 IP 並發起配對。視窗到期不會自動重新開始。"}, "timeout": {"title": "核對已到期", "detail": "沒有自動恢復或重試；請明確重新開始。"}, "stale": {"title": "名單、身分或信任已變更", "detail": "這一輪不能繼續。請關閉並重新選取名單，再核對新的數字。"}, "initial": {"title": "尚未開始核對", "detail": "選擇發起核對，或等待對方發起。配對不會自動取得老師權限。"}, "rejected": {"title": "本輪已中止", "detail": "這一輪不再接受確認；既有信任不會因中止而撤銷。請先確認對方與網路，再明確重新開始。"}};document.querySelector('#intent').textContent="完成後會將這筆本機名單綁定到此次核對的身分。姓名與老師標籤只供辨識，不代表信任或權限。";let current;const $=id=>document.getElementById(id);const names={initial:'未開始',listening:'等候',sasshown:'核對碼',waiting:'結果等候',paired:'本機完成',timeout:'到期',stale:'資料變更'};for(const [state,name]of Object.entries(names)){const b=document.createElement('button');b.textContent=name;b.dataset.state=state;b.onclick=()=>render(state);$('states').append(b)}function render(state){current=state;const c=copy[state];$('title').textContent=c.title;$('detail').textContent=c.detail;$('number').textContent=['sasshown','waiting'].includes(state)?'123 456':'— — —   — — —';$('countdown').textContent=['sasshown','waiting','listening'].includes(state)?'剩餘 96 秒':'';$('compared').checked=false;$('compared').disabled=state!=='sasshown';$('confirm').disabled=true;$('reject').disabled=state!=='sasshown';$('begin').disabled=$('listen').disabled=!['initial','timeout','rejected'].includes(state);$('error').textContent='';for(const b of $('states').children)b.setAttribute('aria-pressed',String(b.dataset.state===state))} $('compared').onchange=()=>{$('confirm').disabled=current!=='sasshown'||!$('compared').checked};$('confirm').onclick=()=>render('waiting');$('reject').onclick=()=>render('rejected');$('begin').onclick=()=>render('sasshown');$('listen').onclick=()=>render('listening');$('close').onclick=()=>{$('error').textContent='預覽不會關閉分頁；正式視窗會先使本輪失效，再結束工作。'};window.addEventListener('blur',()=>{$('compared').checked=false;$('confirm').disabled=true});render(new URLSearchParams(location.search).get('state')in copy?new URLSearchParams(location.search).get('state'):'initial');</script></html>
